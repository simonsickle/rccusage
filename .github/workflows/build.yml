name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build - ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # macOS Intel (cross-compiled from ARM runner)
          - name: macOS-x64
            os: macos-latest
            target: x86_64-apple-darwin
            binary_name: rccusage
            artifact_name: rccusage-darwin-x64

          # macOS Apple Silicon (native ARM runner)
          - name: macOS-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary_name: rccusage
            artifact_name: rccusage-darwin-arm64

          # Linux x64 (GNU)
          - name: Linux-x64-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: rccusage
            artifact_name: rccusage-linux-x64

          # Linux ARM64
          - name: Linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: rccusage
            artifact_name: rccusage-linux-arm64

          # Windows x64
          - name: Windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: rccusage.exe
            artifact_name: rccusage-windows-x64

          # Windows ARM64
          - name: Windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            binary_name: rccusage.exe
            artifact_name: rccusage-windows-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.platform.name }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ matrix.platform.name }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      # Install cross-compilation tools for ARM64 Linux
      - name: Install ARM64 Linux tools
        if: matrix.platform.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build binary
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.platform.target }}/release
          tar czf ../../../${{ matrix.platform.artifact_name }}.tar.gz ${{ matrix.platform.binary_name }}
          cd ../../../
          shasum -a 256 ${{ matrix.platform.artifact_name }}.tar.gz > ${{ matrix.platform.artifact_name }}.tar.gz.sha256

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target\${{ matrix.platform.target }}\release
          7z a ..\..\..\${{ matrix.platform.artifact_name }}.zip ${{ matrix.platform.binary_name }}
          cd ..\..\..\
          Get-FileHash ${{ matrix.platform.artifact_name }}.zip -Algorithm SHA256 | Select-Object -ExpandProperty Hash > ${{ matrix.platform.artifact_name }}.zip.sha256

      - name: Upload artifacts (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: |
            ${{ matrix.platform.artifact_name }}.tar.gz
            ${{ matrix.platform.artifact_name }}.tar.gz.sha256
          retention-days: 30

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: |
            ${{ matrix.platform.artifact_name }}.zip
            ${{ matrix.platform.artifact_name }}.zip.sha256
          retention-days: 30

      # Also upload raw binary for convenience
      - name: Upload raw binary
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform.artifact_name }}-raw
          path: target/${{ matrix.platform.target }}/release/${{ matrix.platform.binary_name }}
          retention-days: 30

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --verbose

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

  # Create a "latest" pre-release on every push to main
  latest-release:
    name: Update Latest Release
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./artifacts

      - name: Display structure of downloaded files
        run: ls -R ./artifacts

      - name: Prepare release assets
        run: |
          mkdir -p ./release
          # Copy all tar.gz and zip files (skip raw binary dirs)
          find ./artifacts -name "*.tar.gz" -exec cp {} ./release/ \;
          find ./artifacts -name "*.zip" -exec cp {} ./release/ \;
          find ./artifacts -name "*.sha256" -exec cp {} ./release/ \;
          ls -la ./release/

      - name: Delete existing latest release
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build (unstable)"
          files: ./release/*
          draft: false
          prerelease: true
          make_latest: false
          body: |
            ## Latest Build from `main`

            This is an automatically generated pre-release from the latest commit on `main`.
            These binaries are built on every merge to `main` and may be unstable.

            **Commit:** ${{ github.sha }}
            **Date:** ${{ github.event.head_commit.timestamp }}

            For stable releases, see the [latest versioned release](https://github.com/${{ github.repository }}/releases/latest).

            ### Download

            | Platform | Architecture | File |
            |----------|-------------|------|
            | macOS | Intel (x64) | `rccusage-darwin-x64.tar.gz` |
            | macOS | Apple Silicon (ARM64) | `rccusage-darwin-arm64.tar.gz` |
            | Linux | x64 | `rccusage-linux-x64.tar.gz` |
            | Linux | ARM64 | `rccusage-linux-arm64.tar.gz` |
            | Windows | x64 | `rccusage-windows-x64.zip` |
            | Windows | ARM64 | `rccusage-windows-arm64.zip` |

            ### Checksums
            SHA256 checksums are provided for all binaries.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Create a versioned release on tag push
  release:
    name: Create Release
    needs: [build, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./artifacts

      - name: Display structure of downloaded files
        run: ls -R ./artifacts

      - name: Prepare release assets
        run: |
          mkdir -p ./release
          # Copy all tar.gz and zip files
          find ./artifacts -name "*.tar.gz" -exec cp {} ./release/ \;
          find ./artifacts -name "*.zip" -exec cp {} ./release/ \;
          find ./artifacts -name "*.sha256" -exec cp {} ./release/ \;
          ls -la ./release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Installation

            ### Cargo (crates.io)
            ```bash
            cargo install rccusage
            ```

            ### macOS
            ```bash
            # Intel Mac
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/rccusage-darwin-x64.tar.gz | tar xz
            chmod +x rccusage
            sudo mv rccusage /usr/local/bin/

            # Apple Silicon Mac
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/rccusage-darwin-arm64.tar.gz | tar xz
            chmod +x rccusage
            sudo mv rccusage /usr/local/bin/
            ```

            ### Linux
            ```bash
            # x64
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/rccusage-linux-x64.tar.gz | tar xz
            chmod +x rccusage
            sudo mv rccusage /usr/local/bin/

            # ARM64
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/rccusage-linux-arm64.tar.gz | tar xz
            chmod +x rccusage
            sudo mv rccusage /usr/local/bin/
            ```

            ### Windows
            Download the appropriate `.zip` file and extract `rccusage.exe` to a directory in your PATH.

            ## Checksums
            SHA256 checksums are provided for all binaries.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
